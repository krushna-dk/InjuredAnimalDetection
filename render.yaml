services:
  - type: web
    name: injured-animal-detection
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: DUPLICATE_COOLDOWN_SECONDS
        value: "600"
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: UPLOAD_DIR
        value: uploads
      - key: DB_SSL
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: BREVO_API_KEY
        sync: false
